version: 2
updates:
  # Node.js server dependencies
  - package-ecosystem: "npm"
    directory: "/messenger-server"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # Bundle minor and patch updates into one PR to keep the noise down
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
